name: Apply address search patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-address-search-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/yandelaroli/geofencewhatsapp/MainActivityV3.kt')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'import java.net.URLEncoder\n',
              'import java.net.URLEncoder\nimport java.text.Normalizer\n',
              1
          )

          text = text.replace(
              'if(candidate.isNotBlank() && candidate.length>1 && candidate.contains(term,true)) suggestions.add(candidate)',
              'if(candidate.isNotBlank() && candidate.length>1 && matchesTyped(candidate,term)) suggestions.add(candidate)',
              1
          )

          old = 'val c=URL("https://photon.komoot.io/api/?q=${URLEncoder.encode(q,"UTF-8")}&limit=80&lang=pt&countrycode=BR").openConnection() as HttpURLConnection'
          new = '''val layerFilter=when(kind){
            Kind.CITY->"&layer=city&layer=locality"
            Kind.DISTRICT->"&layer=district&layer=locality"
            Kind.STREET->"&layer=street"
        }
        val c=URL("https://photon.komoot.io/api/?q=${URLEncoder.encode(q,"UTF-8")}&limit=80&lang=pt&countrycode=BR$layerFilter").openConnection() as HttpURLConnection'''
          if old not in text:
              raise SystemExit('Photon URL not found')
          text = text.replace(old, new, 1)

          marker = '\nprivate suspend fun addressSearch(q:String): List<Resolved>'
          helper = r'''
private fun normalizeSearchText(value:String):String = Normalizer.normalize(value,Normalizer.Form.NFD)
    .replace(Regex("\\p{M}+"),"")
    .lowercase(Locale.ROOT)
    .replace(Regex("[^a-z0-9 ]")," ")
    .replace(Regex("\\s+")," ")
    .trim()

private fun matchesTyped(candidate:String,typed:String):Boolean{
    val candidateText=normalizeSearchText(candidate)
    val typedText=normalizeSearchText(typed)
    if(typedText.isBlank())return false
    val candidateWords=candidateText.split(" ").filter{it.isNotBlank()}
    val typedWords=typedText.split(" ").filter{it.isNotBlank()}
    return typedWords.all{part->candidateWords.any{word->word.startsWith(part)} || candidateText.contains(part)}
}
'''
          if 'private fun matchesTyped(' not in text:
              text = text.replace(marker, helper + marker, 1)

          text = text.replace(
              'OutlinedTextField(value,onChange,Modifier.fillMaxWidth(),enabled=enabled,',
              'OutlinedTextField(value,onChange,Modifier.fillMaxWidth().height(52.dp),enabled=enabled,',
              1
          )
          text = text.replace(
              'OutlinedTextField(number,{number=it.take(10);clearCoords()},Modifier.width(96.dp),enabled=streetSelected,',
              'OutlinedTextField(number,{number=it.take(10);clearCoords()},Modifier.width(82.dp).height(52.dp),enabled=streetSelected,',
              1
          )
          text = text.replace('Box(Modifier.width(92.dp)) {','Box(Modifier.width(78.dp)) {',1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yandelaroli/geofencewhatsapp/MainActivityV3.kt
          git commit -m "Refine district street autocomplete and compact fields"
          git push
